<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Papeles del Tiempo</title><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Courier+Prime:wght@400;700&family=Figtree:wght@400;600&family=Young+Serif&display=swap"><style id="app-style">
/* Layout: papelería con catálogo de fichas tipo papel pegado con washi tape; panel de administración desplegable arriba del catálogo. */
:root{
  --bg:#F6F4F9; --surface:#FFFFFF; --ink:#231D45; --ink-2:#5B5679; --line:#DDD8E8; --rule:rgba(35,29,69,.09);
  --accent:#2E7D70; --accent-ink:#FFFFFF; --danger:#B3342F;
  --tape-a:#F2C6D2; --tape-b:#F4E3A1; --tape-c:#BFE0D6; --tape-d:#CFC6EE;
  --font-hand:'Caveat','Segoe Print','Bradley Hand',cursive; --font-display:'Young Serif',Georgia,serif; --font-body:'Figtree',system-ui,sans-serif; --font-mono:'Courier Prime','Courier New',monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17142A; --surface:#211D3A; --ink:#EEEAF8; --ink-2:#A9A3C6; --line:#38325A; --rule:rgba(238,234,248,.10);
    --accent:#5FC0AE; --accent-ink:#0F1F1C; --danger:#F08A84;
    --tape-a:#8E5468; --tape-b:#8A7A33; --tape-c:#3F7468; --tape-d:#625A99;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17142A; --surface:#211D3A; --ink:#EEEAF8; --ink-2:#A9A3C6; --line:#38325A; --rule:rgba(238,234,248,.10);
  --accent:#5FC0AE; --accent-ink:#0F1F1C; --danger:#F08A84;
  --tape-a:#8E5468; --tape-b:#8A7A33; --tape-c:#3F7468; --tape-d:#625A99;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:22px/1.1 var(--font-display);color:var(--ink)}
.brand svg{width:34px;height:34px;flex:none}
.brand img.logo{width:48px;height:48px;border-radius:50%;flex:none;background:#fff}
.hero{padding-block:36px 20px}
.eyebrow{font:700 12px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
.hero h1{font:400 clamp(30px,6.4vw,52px)/1.08 var(--font-display);margin:0;max-width:19ch;text-wrap:balance}
.hero p{margin:16px 0 0;max-width:52ch;color:var(--ink-2)}
.cats{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px 8px}
.cat{font:600 14px/1 var(--font-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:11px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.cat span{font:400 13px/1 var(--font-mono);color:var(--ink-2)}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat[aria-pressed="true"] span{color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 14px;padding-block:18px 40px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px 10px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tone-a{--tape:var(--tape-a)} .tone-b{--tape:var(--tape-b)} .tone-c{--tape:var(--tape-c)} .tone-d{--tape:var(--tape-d)}
.tape{position:absolute;top:-9px;left:50%;width:68px;height:20px;background:var(--tape);opacity:.95;transform:translateX(-50%) rotate(-3deg);z-index:2}
.card:nth-child(even) .tape{transform:translateX(-50%) rotate(2.5deg)}
.media{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;border-radius:2px;background:var(--bg)}
.media img{display:block;width:100%;height:100%;object-fit:cover}
.cover{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;background-color:var(--surface);background-color:color-mix(in srgb,var(--tape) 40%,var(--surface));background-image:repeating-linear-gradient(transparent 0 25px,var(--rule) 25px 26px)}
.cover span{font:400 clamp(17px,3.4vw,22px)/1.2 var(--font-display);color:var(--ink);text-wrap:balance;background:var(--surface);padding:8px 10px;border:1px solid var(--line)}
.tags{position:absolute;left:6px;top:6px;display:flex;gap:4px;flex-wrap:wrap;z-index:1}
.tag{font:700 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 6px;background:var(--ink);color:var(--bg);border-radius:2px}
.tag.ex{background:var(--surface);color:var(--ink);border:1px solid var(--ink)}
.cat-name{font:700 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.card h3{font:400 19px/1.2 var(--font-display);margin:0;overflow-wrap:anywhere}
.desc{margin:0;color:var(--ink-2);font-size:14px;overflow-wrap:anywhere}
.price{font:700 16px/1.2 var(--font-mono)}
.price.none{font-weight:400;color:var(--ink-2);font-size:14px}
.card .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:42px;padding:8px 14px;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 14px/1.2 var(--font-body);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.note{font-size:13px;color:var(--ink-2)}
.empty{grid-column:1/-1;border:1px dashed var(--line);padding:32px 16px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;font:400 20px/1.2 var(--font-display);color:var(--ink);margin-bottom:6px}
.site-foot{border-top:1px solid var(--line);padding-block:24px 36px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-size:14px}
.site-foot strong{font:700 12px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.admin{border:1px dashed var(--ink-2);background:var(--surface);padding:16px;margin-block:16px;display:flex;flex-direction:column;gap:20px}
.admin h2{font:400 22px/1.2 var(--font-display);margin:0}
.admin h3{font:700 12px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:820px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row .thumb{width:44px;height:55px;flex:none;object-fit:cover;background:var(--bg);border:1px solid var(--line)}
.row .info{flex:1 1 140px;min-width:0}
.row .info b{display:block;overflow-wrap:anywhere}
.row .info small{color:var(--ink-2)}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label{font-weight:600;font-size:14px}
.field input[type=text],.field select,.field textarea{width:100%;font:16px/1.4 var(--font-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:10px}
.field textarea{min-height:84px;resize:vertical}
.field small{color:var(--ink-2)}
.check{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.err{color:var(--danger);font-size:14px;min-height:1.2em;margin:0 0 8px}
.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo img{width:72px;height:90px;object-fit:cover;border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pubbar{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-inline:-16px}
.pubbar .st{font-size:14px}
.pubbar .sz{font:400 13px/1.2 var(--font-mono);color:var(--ink-2)}
.search{padding-block:6px 0}
.search input{width:100%;max-width:460px;font:16px/1.4 var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.search input::placeholder{color:var(--ink-2)}
.pricetag{position:absolute;right:6px;bottom:6px;z-index:1;background:var(--surface);color:var(--ink);border:2px dashed var(--ink);padding:6px 10px;font:700 17px/1 var(--font-mono);transform:rotate(-2deg)}
.money{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:3px;padding-left:12px}
.money b{font:700 17px/1 var(--font-mono)}
.field .money input[type=text]{border:0;background:transparent;border-radius:0;padding:10px 10px 10px 4px}
.banner{position:relative;margin-top:16px;height:clamp(190px,36vw,270px);overflow:hidden;background-color:var(--surface);background-color:color-mix(in srgb,var(--tape-d) 38%,var(--surface));background-image:radial-gradient(var(--rule) 1.2px,transparent 1.5px);background-size:16px 16px;clip-path:polygon(0 0,100% 0,100% 90%,96% 95%,92% 90%,88% 95%,84% 90%,80% 95%,76% 90%,72% 95%,68% 90%,64% 95%,60% 90%,56% 95%,52% 90%,48% 95%,44% 90%,40% 95%,36% 90%,32% 95%,28% 90%,24% 95%,20% 90%,16% 95%,12% 90%,8% 95%,4% 90%,0 95%)}
.sheet{position:absolute;left:4%;top:16%;width:min(62%,430px);padding:18px 18px 16px 22px;background-color:var(--surface);background-image:repeating-linear-gradient(transparent 0 29px,var(--rule) 29px 30px);border:1px solid var(--line);transform:rotate(-2deg);box-shadow:3px 4px 0 var(--rule)}
.sheet p{margin:0;font:600 clamp(26px,6vw,46px)/1.05 var(--font-hand);color:var(--ink)}
.sheet small{display:block;margin-top:10px;font:700 11px/1.3 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.washi{position:absolute;height:22px;opacity:.93;background-color:var(--tape-a);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 5px,transparent 5px 10px);z-index:3}
.w1{width:96px;left:calc(4% + 36px);top:calc(16% - 12px);transform:rotate(-6deg)}
.w2{width:80px;right:5%;top:8%;background-color:var(--tape-b);transform:rotate(8deg)}
.w3{width:84px;left:36%;bottom:16%;background-color:var(--tape-c);transform:rotate(-4deg)}
.polaroid{position:absolute;background:var(--surface);border:1px solid var(--line);padding:7px 7px 4px;box-shadow:3px 4px 0 var(--rule);display:flex;flex-direction:column;gap:2px;text-align:center}
.polaroid .ph{width:clamp(62px,13vw,104px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;background-color:var(--bg);background-color:color-mix(in srgb,var(--tape) 55%,var(--surface))}
.polaroid .ph svg{width:72%;height:auto}
.polaroid span{font:600 clamp(15px,2.6vw,20px)/1.1 var(--font-hand);color:var(--ink)}
.po1{right:4%;top:14%;transform:rotate(5deg)}
.po2{right:25%;bottom:14%;transform:rotate(-6deg)}
.flor{position:absolute;width:clamp(38px,8vw,64px);height:auto}
.flor .p{fill:var(--tape-a);stroke:var(--ink);stroke-width:1}
.flor.lila .p{fill:var(--tape-d)}
.flor .c{fill:var(--tape-b);stroke:var(--ink);stroke-width:1}
.flor .l{fill:var(--tape-c);stroke:var(--ink);stroke-width:1}
.fl1{left:1.5%;bottom:14%;transform:rotate(-12deg)}
.fl2{left:47%;top:5%;transform:rotate(14deg)}
.stamp{position:absolute;right:2.5%;bottom:3%;width:clamp(68px,13vw,104px);color:var(--accent);transform:rotate(12deg);opacity:.9}
.stamp text{font:700 10.5px var(--font-mono);fill:currentColor}
.stamp .ring{fill:none;stroke:currentColor;stroke-width:1.5}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--accent);border-radius:3px;min-height:42px;padding:3px}
.sbtn{width:36px;height:34px;flex:none;border:0;border-radius:2px;background:var(--accent);color:var(--accent-ink);font:700 20px/1 var(--font-body);cursor:pointer}
.qty{flex:1;text-align:center;font:600 13px/1.2 var(--font-body);color:var(--ink)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ink)}
.cb-btn{width:100%;max-width:1048px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border:0;border-radius:3px;min-height:48px;padding:8px 14px;font:600 15px/1.2 var(--font-body);cursor:pointer;text-align:left}
.cb-n{font:400 13px/1.2 var(--font-mono);flex:1}
.cb-s{font:700 15px/1.2 var(--font-mono)}
.has-cart .site-foot{padding-bottom:104px}
.ov{position:fixed;inset:0;z-index:30;background:rgba(20,16,40,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center}}
.cpanel{width:min(580px,100%);max-height:94%;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--ink);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.cpanel h2{font:400 24px/1.2 var(--font-display);margin:0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.clines{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.cline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cline .ci{grid-column:1/-1;min-width:0}
.cline .ci b{display:block;overflow-wrap:anywhere}
.cline .ci small{color:var(--ink-2)}
.cline .cs{font:700 15px/1.2 var(--font-mono);text-align:right}
.cline .stepper{width:124px;border-color:var(--line)}
.cline .sbtn{background:var(--ink);color:var(--bg)}
.ctotal{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font:700 18px/1.3 var(--font-mono)}
.cnote{color:var(--ink-2);font-size:14px;margin:0}
.cprev{width:100%;font:13px/1.45 var(--font-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:10px;min-height:150px;resize:vertical}
.cactions{display:flex;flex-direction:column;gap:8px}
@media (max-width:559px){.po2,.w3{display:none}}

/* ---------- Carrito ---------- */
var cart={items:{},name:'',notes:''};
var ctrls={};
var clearAsk=false;
function loadCart(){
  try{
    var raw=localStorage.getItem('pdt-cart-v1');
    if(raw){
      var c=JSON.parse(raw);
      if(c&&typeof c==='object'){
        cart.items=(c.items&&typeof c.items==='object')?c.items:{};
        cart.name=String(c.name||''); cart.notes=String(c.notes||'');
      }
    }
  }catch(e){}
}
function saveCart(){try{localStorage.setItem('pdt-cart-v1',JSON.stringify(cart));}catch(e){}}
function prodById(id){for(var i=0;i<state.products.length;i++){if(state.products[i].id===id) return state.products[i];}return null;}
function priceNum(p){var d=String(p.price==null?'':p.price).replace(/\D/g,'');return d?Number(d):null;}
function money(n){return '$ '+n.toLocaleString('es-AR');}
function qtyOf(id){return Number(cart.items[id])||0;}
function totals(){
  var ls=[],n=0,sum=0,unpriced=0;
  Object.keys(cart.items).forEach(function(id){
    var p=prodById(id), q=Math.min(99,Number(cart.items[id])||0);
    if(!p||p.agotado||q<1) return;
    var unit=priceNum(p);
    ls.push({p:p,q:q,unit:unit});
    n+=q;
    if(unit==null) unpriced+=q; else sum+=unit*q;
  });
  return {ls:ls,n:n,sum:sum,unpriced:unpriced};
}
function setQty(id,q){
  q=Math.max(0,Math.min(99,q));
  if(q===0) delete cart.items[id]; else cart.items[id]=q;
  saveCart(); updateCtrl(id); renderCartBar();
  if(el.ov&&!el.ov.hidden) renderCart();
}
function focusCtrl(id,which){
  var box=ctrls[id]; if(!box) return;
  var b=box.querySelector('.'+which)||box.querySelector('button');
  if(b) b.focus();
}
function focusLine(id,which){
  var b=el.cartLines.querySelector('[data-k="'+id+'-'+which+'"]');
  if(b) b.focus();
}
function stepper(id,q,name,inPanel){
  function go(d,which){
    setQty(id,qtyOf(id)+d);
    if(inPanel) focusLine(id,which); else focusCtrl(id,which);
  }
  return h('div',{class:'stepper'},
    h('button',{type:'button',class:'sbtn minus','data-k':id+'-minus','aria-label':'Quitar uno de '+name,text:'−',onclick:function(){go(-1,'minus');}}),
    h('span',{class:'qty',text:inPanel?String(q):(q+' en el pedido')}),
    h('button',{type:'button',class:'sbtn plus','data-k':id+'-plus','aria-label':'Agregar uno más de '+name,text:'+',onclick:function(){go(1,'plus');}}));
}
function updateCtrl(id){
  var box=ctrls[id], p=prodById(id);
  if(!box||!p) return;
  box.textContent='';
  var q=qtyOf(id);
  if(q<1) box.append(h('button',{type:'button',class:'btn',text:'Agregar al pedido',onclick:function(){setQty(id,1);focusCtrl(id,'plus');}}));
  else box.append(stepper(id,q,p.name,false));
}
function orderText(){
  var t=totals(), L=[];
  L.push('Hola! Quiero hacer este pedido en Papeles del Tiempo:');
  L.push('');
  t.ls.forEach(function(l){L.push('• '+l.q+' x '+l.p.name+' — '+(l.unit!=null?money(l.unit*l.q):'consultar precio'));});
  L.push('');
  if(t.sum>0) L.push('Total'+(t.unpriced?' (sin los productos a consultar)':'')+': '+money(t.sum));
  else L.push('Total: a consultar');
  var nm=cart.name.trim(), nt=cart.notes.trim();
  if(nm) L.push('Nombre: '+nm);
  if(nt) L.push('Aclaraciones: '+nt);
  L.push('');
  L.push('Retiro en persona. ¿Cuándo podemos coordinar?');
  return L.join('\n');
}
function renderCartBar(){
  if(!el.cartBar) return;
  var t=totals();
  var adminOpen=isAdmin&&el.admin&&!el.admin.hidden;
  var show=t.n>0&&!adminOpen;
  el.cartBar.hidden=!show;
  root.classList.toggle('has-cart',show);
  el.cbN.textContent=t.n+(t.n===1?' producto':' productos');
  el.cbS.textContent=t.sum>0?(money(t.sum)+(t.unpriced?' + a consultar':'')):(t.unpriced?'Precio a consultar':'');
}
function renderMsg(){
  var t=totals(), ok=waOk();
  el.cPreview.value=t.n?orderText():'';
  el.cActions.hidden=!t.n;
  el.cForm.hidden=!t.n;
  el.cSend.hidden=!ok;
  if(ok) el.cSend.setAttribute('href','https://wa.me/'+waNum()+'?text='+encodeURIComponent(orderText()));
  el.cHint.textContent=ok?'Se abre WhatsApp con tu pedido listo para enviar. Revisalo y enviá el mensaje desde ahí.':(isAdmin?'Cargá tu WhatsApp en Administrar, en Datos de la tienda, para activar el envío.':'El WhatsApp de la tienda todavía no está configurado. Copiá el mensaje para enviarlo por tu cuenta.');
}
function renderCart(){
  var t=totals();
  el.cartLines.textContent='';
  if(!t.n) el.cartLines.append(h('p',{class:'note',text:'Tu pedido está vacío. Agregá productos desde el catálogo.'}));
  t.ls.forEach(function(l){
    var id=l.p.id;
    el.cartLines.append(h('div',{class:'cline'},
      h('div',{class:'ci'},h('b',{text:l.p.name}),h('small',{text:l.unit!=null?(money(l.unit)+' c/u'):'Precio a consultar'})),
      stepper(id,l.q,l.p.name,true),
      h('div',{class:'cs',text:l.unit!=null?money(l.unit*l.q):'A consultar'}),
      h('button',{type:'button',class:'btn ghost small','aria-label':'Quitar '+l.p.name+' del pedido',text:'Quitar',onclick:function(){setQty(id,0);if(!totals().n) el.cClose.focus();}})));
  });
  el.cTotal.textContent='';
  if(t.n){
    el.cTotal.append(h('span',{text:'Total'}),h('span',{text:t.sum>0?money(t.sum):'A consultar'}));
  }
  el.cNote.textContent=t.n&&t.unpriced?'Los productos sin precio se cotizan por WhatsApp.':'';
  renderMsg();
}
function openCart(){
  renderCart(); el.ov.hidden=false; document.body.style.overflow='hidden'; el.cClose.focus();
}
function closeCart(){
  el.ov.hidden=true; document.body.style.overflow='';
  clearAsk=false; el.cClear.textContent='Vaciar pedido'; el.cStatus.textContent='';
  if(el.cbBtn&&!el.cartBar.hidden) el.cbBtn.focus();
}
function copyMsg(){
  var txt=orderText();
  function done(){el.cStatus.textContent='Mensaje copiado.';}
  function fail(){el.cPreview.focus();el.cPreview.select();el.cStatus.textContent='Seleccioná el texto y copialo.';}
  try{ navigator.clipboard.writeText(txt).then(done,fail); }catch(e){ fail(); }
}
function buildCart(){
  loadCart();
  el.cbN=h('span',{class:'cb-n'}); el.cbS=h('span',{class:'cb-s'});
  el.cbBtn=h('button',{type:'button',class:'cb-btn',onclick:openCart},h('span',{text:'Ver mi pedido'}),el.cbN,el.cbS);
  el.cartBar=h('div',{class:'cartbar',hidden:true},el.cbBtn);
  el.cartLines=h('div',{class:'clines'});
  el.cTotal=h('div',{class:'ctotal'});
  el.cNote=h('p',{class:'cnote'});
  el.cName=h('input',{type:'text',id:'c-name',maxlength:'60',autocomplete:'name',oninput:function(){cart.name=this.value;saveCart();renderMsg();}});
  el.cNotes=h('textarea',{id:'c-notes',maxlength:'400',oninput:function(){cart.notes=this.value;saveCart();renderMsg();}});
  el.cName.value=cart.name; el.cNotes.value=cart.notes;
  el.cForm=h('div',{},
    field('Tu nombre (opcional)','c-name',el.cName),
    field('Aclaraciones (opcional)','c-notes',el.cNotes,'Por ejemplo frases, colores o personalización.'));
  el.cPreview=h('textarea',{id:'c-prev',class:'cprev',readonly:true,rows:'9','aria-label':'Vista previa del mensaje'});
  el.cSend=h('a',{class:'btn',target:'_blank',rel:'noopener',text:'Enviar pedido por WhatsApp'});
  el.cCopy=h('button',{type:'button',class:'btn ghost',text:'Copiar mensaje',onclick:copyMsg});
  el.cClear=h('button',{type:'button',class:'btn danger small',text:'Vaciar pedido',onclick:function(){
    if(!clearAsk){clearAsk=true;this.textContent='Confirmar: vaciar pedido';return;}
    clearAsk=false; this.textContent='Vaciar pedido';
    var ids=Object.keys(cart.items); cart.items={}; saveCart();
    ids.forEach(updateCtrl); renderCartBar(); renderCart(); el.cClose.focus();
  }});
  el.cHint=h('p',{class:'cnote'}); el.cStatus=h('p',{class:'cnote',role:'status'});
  el.cActions=h('div',{class:'cactions'},el.cSend,el.cCopy,el.cHint,el.cStatus,h('div',{},el.cClear));
  el.cClose=h('button',{type:'button',class:'btn ghost small',text:'Cerrar',onclick:closeCart});
  el.ov=h('div',{class:'ov',hidden:true,onclick:function(e){if(e.target===this) closeCart();}},
    h('div',{class:'cpanel',role:'dialog','aria-modal':'true','aria-labelledby':'c-title'},
      h('div',{class:'chead'},h('h2',{id:'c-title',text:'Tu pedido'}),el.cClose),
      el.cartLines,el.cTotal,el.cNote,el.cForm,
      h('div',{class:'field'},h('label',{for:'c-prev',text:'Vista previa del mensaje'}),el.cPreview),
      el.cActions));
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!el.ov.hidden) closeCart();});
  root.append(el.cartBar,el.ov);
}

function mark(){
  var ns='http://www.w3.org/2000/svg';
  var s=document.createElementNS(ns,'svg');
  s.setAttribute('viewBox','0 0 40 40'); s.setAttribute('aria-hidden','true');
  s.innerHTML='<circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/><path d="M20 10v10l7 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
  return s;
}

function build(){
  el.actions=h('div',{class:'btns'});
  el.cats=h('nav',{class:'cats','aria-label':'Categorías'});
  el.grid=h('section',{class:'grid','aria-label':'Productos'});
  el.foot=h('footer',{class:'site-foot'});

    h('div',{class:'brand'},state.settings.logo?h('img',{class:'logo',src:state.settings.logo,alt:'',width:'48',height:'48'}):mark(),h('span',{text:'Papeles del Tiempo'})),
    el.actions);

    h('p',{class:'eyebrow',text:'Papelería · Retiro en persona'}),

    h('p',{text:'Cuadernos de viaje, tarjetas, planners, stickers, journaling y más. Armá tu pedido, enviálo por WhatsApp y coordinamos el retiro.'}));

function renderAll(){renderCats();renderGrid();renderFoot();}

function renderCats(){
  el.cats.textContent='';
  var all=[{id:'todo',name:'Todo'}].concat(CATS);
  all.forEach(function(c){
    var n=state.products.filter(function(p){return matchQ(p)&&(c.id==='todo'||p.cat===c.id);}).length;
    el.cats.append(h('button',{type:'button',class:'cat','aria-pressed':String(filter===c.id),onclick:function(){filter=c.id;renderCats();renderGrid();}},c.name,h('span',{text:String(n)})));
  });
}

function card(p){
  var cat=catOf(p.cat);
  var media=h('div',{class:'media'});
  if(p.foto) media.append(h('img',{src:p.foto,alt:p.name,loading:'lazy',decoding:'async'}));
  else media.append(h('div',{class:'cover'},h('span',{text:p.name})));
  var tags=h('div',{class:'tags'});
  if(p.agotado) tags.append(h('span',{class:'tag',text:'Agotado'}));
  if(p.ejemplo) tags.append(h('span',{class:'tag ex',text:'Ejemplo'}));
  if(tags.children.length) media.append(tags);
  var pt=fmtPrice(p.price);
  if(pt) media.append(h('span',{class:'pricetag',text:pt}));
  var foot=h('div',{class:'foot'});
  if(!pt) foot.append(h('div',{class:'price none',text:'Consultar precio'}));
  if(p.agotado){
    if(waOk()) foot.append(h('a',{class:'btn ghost',href:waLink(p),target:'_blank',rel:'noopener',text:'Consultar cuándo hay'}));
  }else{
    var box=h('div',{class:'ctrl'});
    ctrls[p.id]=box; foot.append(box); updateCtrl(p.id);
  }
  return h('article',{class:'card tone-'+cat.tone},
    h('span',{class:'tape','aria-hidden':'true'}),
    media,
    h('div',{class:'cat-name',text:cat.name}),
    h('h3',{text:p.name}),
    p.desc?h('p',{class:'desc',text:p.desc}):null,
    foot);
}

function renderGrid(){
  el.grid.textContent='';
  var list=state.products.filter(function(p){return matchQ(p)&&(filter==='todo'||p.cat===filter);});
  if(!list.length){
    if(query.trim()){
      el.grid.append(h('div',{class:'empty'},
        h('strong',{text:'No encontramos productos con esa búsqueda'}),
        'Probá con otra palabra o escribinos por WhatsApp.',
        h('div',{},h('button',{type:'button',class:'btn ghost small',text:'Borrar búsqueda',onclick:function(){query='';el.q.value='';renderCats();renderGrid();}}))));
    }else{
      el.grid.append(h('div',{class:'empty'},
        h('strong',{text:'Todavía no hay productos acá'}),
        isAdmin?'Agregá el primero desde Administrar.':'Volvé pronto o escribinos por WhatsApp.'));
    }
    return;
  }
  list.forEach(function(p){el.grid.append(card(p));});
}

function renderFoot(){
  el.foot.textContent='';
  el.foot.append(h('strong',{text:'Cómo retirar'}),h('span',{text:state.settings.retiro||''}));
  var ig=String(state.settings.instagram||'').replace(/^@/,'').replace(/[^\w.]/g,'');
  if(ig) el.foot.append(h('span',{},'Instagram: ',h('a',{href:'https://instagram.com/'+ig,target:'_blank',rel:'noopener',text:'@'+ig})));
}

        h('button',{type:'button',class:'btn ghost small',onclick:function(){startEdit(p);},text:'Editar'}),

function renderPreview(){
  el.fPrev.textContent='';
  if(form.foto){
    el.fPrev.append(h('img',{src:form.foto,alt:'Vista previa de la foto'}),
      h('button',{type:'button',class:'btn ghost small',text:'Quitar foto',onclick:function(){form.foto='';el.fFile.value='';renderPreview();}}));

function refreshBar(){
  if(!el.pubSt) return;
  var dirty=JSON.stringify(state)!==saved;
  el.pubSt.textContent=dirty?'Hay cambios sin publicar.':'Todo publicado.';
  el.pubSz.textContent='Tamaño de la página: '+mb(docSize())+' MB de 16 MB';

function msg(t){if(el.pubSt) el.pubSt.textContent=t;}

function startEdit(p){
  form={id:p.id,foto:p.foto||''};
  el.fName.value=p.name; el.fCat.value=p.cat; el.fDesc.value=p.desc||''; el.fPrice.value=String(p.price||'').replace(/\D/g,''); el.fAgot.checked=!!p.agotado; el.fFile.value='';
  el.fTitle.textContent='Editar producto'; el.fSubmit.textContent='Guardar producto'; el.fCancel.hidden=false; el.fErr.textContent='';
  renderPreview();
  el.fName.scrollIntoView({block:'center'}); el.fName.focus();
}

function resetForm(){
  form={id:null,foto:''};
  el.fName.value=''; el.fCat.value=CATS[0].id; el.fDesc.value=''; el.fPrice.value=''; el.fAgot.checked=false; el.fFile.value='';
  el.fTitle.textContent='Agregar producto'; el.fSubmit.textContent='Agregar producto'; el.fCancel.hidden=true; el.fErr.textContent='';
  renderPreview();
}

function submitForm(){
  var name=el.fName.value.trim();
  if(!name){el.fErr.textContent='Escribí el nombre del producto.';el.fName.focus();return;}
  el.fErr.textContent='';
  var data={name:name,cat:el.fCat.value,desc:el.fDesc.value.trim(),price:el.fPrice.value.replace(/\D/g,''),foto:form.foto,agotado:el.fAgot.checked};
  if(form.id){
    var p=state.products.filter(function(x){return x.id===form.id;})[0];
    if(p){Object.assign(p,data);delete p.ejemplo;}
  }else{
    state.products.unshift(Object.assign({id:newId()},data));
  }
  resetForm(); renderAdminList(); renderAll(); refreshBar();
}

function removeProduct(id){
  if(confirmId!==id){confirmId=id;renderAdminList();return;}
  confirmId=null;
  state.products=state.products.filter(function(p){return p.id!==id;});
  if(form.id===id) resetForm();
  renderAdminList(); renderAll(); refreshBar();
}

async function compress(file){
  var bmp=await createImageBitmap(file);
  var max=900, s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(bmp.width*s)); c.height=Math.max(1,Math.round(bmp.height*s));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  var out=c.toDataURL('image/webp',0.72);
  if(out.indexOf('data:image/webp')!==0) out=c.toDataURL('image/jpeg',0.75);
  return out;
}

async function onFile(){
  var f=this.files&&this.files[0];
  if(!f) return;
  el.fErr.textContent='Preparando la foto…';
  try{
    var out=await compress(f);
    if(docSize()+out.length>MAX_SOFT){
      el.fErr.textContent='La página ya está cerca del límite de tamaño. Quitá fotos o usá imágenes más chicas.';
      this.value=''; return;
    }
    form.foto=out; el.fErr.textContent=''; renderPreview();
  }catch(e){
    el.fErr.textContent='No se pudo leer esa imagen. Probá con un archivo JPG o PNG.';
    this.value='';
  }
}

async function publish(){
  if(publishing) return;
  if(JSON.stringify(state)===saved){msg('No hay cambios para publicar.');return;}
  if(docSize()>MAX_HARD){msg('La página supera los 16 MB. Quitá fotos antes de publicar.');return;}
  publishing=true; msg('Publicando…');
  state.updated=new Date().toISOString();
  try{ sessionStorage.setItem('pdt-admin','1'); }catch(e){}
  try{
    await artifact.publish(buildDoc());
    msg('Publicado. Actualizando la página…');
  }catch(e){
    publishing=false;
    var c=e&&e.code;
    if(c==='conflict') msg('Otra persona publicó antes. La página se va a recargar con esa versión.');
    else if(c==='not_writer'||c==='not_granted') msg('No tenés permiso para publicar esta página.');
    else msg('No se pudo publicar. Probá de nuevo.');
  }
}

function openAdmin(){
  el.admin.hidden=false; el.toggle.textContent='Cerrar administración'; el.toggle.setAttribute('aria-expanded','true');
  renderCartBar();
}
function toggleAdmin(){
  if(el.admin.hidden) openAdmin();
  else{el.admin.hidden=true; el.toggle.textContent='Administrar'; el.toggle.setAttribute('aria-expanded','false'); renderCartBar();}
}

async function init(){
  build();
  try{
    var c=window.claude;
    if(c&&c.use){
      var u=await c.use('user');
      var can=u?await u.canEdit():false;
      if(can){artifact=await c.use('artifact'); isAdmin=!!artifact;}
    }
  }catch(e){}
  if(!isAdmin) return;
  el.toggle=h('button',{type:'button',class:'btn ghost small','aria-expanded':'false',onclick:toggleAdmin,text:'Administrar'});
  el.actions.append(el.toggle);
  buildAdmin(); renderAll();
  try{ if(sessionStorage.getItem('pdt-admin')==='1') openAdmin(); }catch(e){}
}
init();
})();
</script></body></html>
